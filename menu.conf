文件
	打开文件浏览器	script-binding file_browser/open-browser
	打开剪贴板链接	loadfile ${clipboard/text}
	保存位置并退出	quit-watch-later
	退出播放器	quit
播放列表
	播放列表内容	$playlist
	上一集	write-watch-later-config; playlist-prev
	下一集	write-watch-later-config; playlist-next
导航
	快退 5 秒	seek -5 exact
	快进 5 秒	seek 5 exact
	快退 60 秒	seek -60 exact
	快进 60 秒	seek 60 exact
	上一帧	frame-back-step
	下一帧	frame-step
	章节	$chapters


平移与扫描
	放大画面	add video-zoom 0.1
	缩小画面	add video-zoom -0.1
	画面左移	add video-pan-x 0.1
	画面右移	add video-pan-x -0.1
	画面上移	add video-pan-y -0.1
	画面下移	add video-pan-y 0.1
	旋转 90°	add video-rotate 1
	旋转复位	set video-rotate 0
	重置画面	set video-zoom 0; no-osd set panscan 0; no-osd set video-pan-x 0; no-osd set video-pan-y 0
视频
	视频轨	$video-tracks
	画面宽高比	cycle-values video-aspect-override "16:9" "4:3" "2.35:1" "no"
	对比度 -	add contrast -1
	对比度 +	add contrast 1
	亮度 -	add brightness -1
	亮度 +	add brightness 1
	伽马 -	add gamma -1
	伽马 +	add gamma 1
	饱和度 -	add saturation -1
	饱和度 +	add saturation 1
	反交错	cycle deinterlace
音频
	音轨	$audio-tracks
	音轨循环	cycle audio
	音频延迟 -0.1s	add audio-delay -0.1
	音频延迟 +0.1s	add audio-delay 0.1
	音频设备	$audio-devices
字幕
	字幕轨	$sub-tracks
	次字幕轨	$secondary-sub-tracks
	显示 / 隐藏	cycle sub-visibility
	字幕延迟 -0.1s	add sub-delay -0.1
	字幕延迟 +0.1s	add sub-delay 0.1
	位置上移	add sub-pos -1
	位置下移	add sub-pos 1
	字幕放大	add sub-scale 0.1
	字幕缩小	add sub-scale -0.1
	字幕样式	cycle-values sub-ass-override "force" "scale"
速度
	0.5x	multiply speed 0.5
	1.0x	set speed 1
	1.5x	multiply speed 1.5
	2.0x	multiply speed 2.0
	加快	multiply speed 1.1
	减慢	multiply speed 1/1.1
	恢复正常	set speed 1

查看
	全屏	cycle fullscreen
	窗口置顶	cycle ontop
	窗口 50%	set window-scale 0.5
	窗口 100%	set window-scale 1.0
	窗口 150%	set window-scale 1.5
	窗口 200%	set window-scale 2.0
	显示进度	show-progress
	播放信息	script-binding stats/display-stats
	观看历史	script-binding select/select-watch-history
着色器
	Shaders OFF	no-osd change-list glsl-shaders clr ""; show-text "GLSL shaders cleared"
	Anime4K 模式 A	no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Restore_CNN_VL.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl;~~/shaders/Anime4K_AutoDownscalePre_x2.glsl;~~/shaders/Anime4K_AutoDownscalePre_x4.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: Mode A (HQ)"
	Anime4K 模式 B	no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Restore_CNN_Soft_VL.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl;~~/shaders/Anime4K_AutoDownscalePre_x2.glsl;~~/shaders/Anime4K_AutoDownscalePre_x4.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: Mode B (HQ)"
	Anime4K 模式 C	no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Upscale_Denoise_CNN_x2_VL.glsl;~~/shaders/Anime4K_AutoDownscalePre_x2.glsl;~~/shaders/Anime4K_AutoDownscalePre_x4.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: Mode C (HQ)"
	Anime4K A+A	no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Restore_CNN_VL.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl;~~/shaders/Anime4K_Restore_CNN_M.glsl;~~/shaders/Anime4K_AutoDownscalePre_x2.glsl;~~/shaders/Anime4K_AutoDownscalePre_x4.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: Mode A+A (HQ)"
	Anime4K B+B	no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Restore_CNN_Soft_VL.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl;~~/shaders/Anime4K_AutoDownscalePre_x2.glsl;~~/shaders/Anime4K_AutoDownscalePre_x4.glsl;~~/shaders/Anime4K_Restore_CNN_Soft_M.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: Mode B+B (HQ)"
	Anime4K C+A	no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Upscale_Denoise_CNN_x2_VL.glsl;~~/shaders/Anime4K_AutoDownscalePre_x2.glsl;~~/shaders/Anime4K_AutoDownscalePre_x4.glsl;~~/shaders/Anime4K_Restore_CNN_M.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: Mode C+A (HQ)"
	ArtCNN	no-osd change-list glsl-shaders set "~~/shaders/ArtCNN_C4F32.glsl"; show-text "ArtCNN C4F32 ON"
	deband	cycle deband


配置
	编辑 mpv.conf	  run notepad "C:/Users/Gosickless/AppData/Roaming/mpv/mpv.conf"
	编辑 input.conf	run notepad "C:/Users/Gosickless/AppData/Roaming/mpv/input.conf"
	编辑 menu.conf	run notepad "C:/Users/Gosickless/AppData/Roaming/mpv/menu.conf"
	编辑 modernz.conf  	run notepad "C:/Users/Gosickless/AppData/Roaming/mpv/script-opts/modernz.conf"
	编辑 context_menu.conf 	run notepad "C:/Users/Gosickless/AppData/Roaming/mpv/script-opts/context_menu.conf"
	打开配置文件夹	run cmd /c start "" "C:/Users/Gosickless/AppData/Roaming/mpv"
工具
	截图（带字幕）	osd-msg screenshot
	截图（无字幕）	osd-msg screenshot video
	截取窗口画面	osd-msg screenshot window
	A-B 循环	ab-loop
	单集循环	cycle-values loop-file "inf" "no"
	控制台	script-binding console/enable
帮助
	按键说明	script-binding select/select-binding
	统计信息	script-binding stats/display-stats-toggle
	mpv 版本	show-text ${mpv-version}
	在线文档	script-binding select/open-docs
