文件
	打开文件浏览器  [Ctrl+O]	script-binding file_browser/open-browser
	打开剪贴板链接	loadfile ${clipboard/text}
	保存位置并退出  [Q]	quit-watch-later
	退出播放器  [q]	quit
播放列表
	播放列表内容  [g-p]	$playlist
	上一集  [<]	write-watch-later-config; playlist-prev
	下一集  [Enter / >]	write-watch-later-config; playlist-next
导航
	快退 5 秒	seek -5 exact
	快进 5 秒	seek 5 exact
	快退 60 秒	seek -60 exact
	快进 60 秒	seek 60 exact
	上一帧  [,]	frame-back-step
	下一帧  [.]	frame-step
	章节  [g-c]	$chapters


平移与扫描
	放大画面	add video-zoom 0.1
	缩小画面	add video-zoom -0.1
	画面左移	add video-pan-x 0.1
	画面右移	add video-pan-x -0.1
	画面上移	add video-pan-y -0.1
	画面下移	add video-pan-y 0.1
	旋转 90°	add video-rotate 1
	旋转复位	set video-rotate 0
	重置画面	set video-zoom 0; no-osd set panscan 0; no-osd set video-pan-x 0; no-osd set video-pan-y 0
视频
	视频轨  [g-v]	$video-tracks
	画面宽高比	cycle-values video-aspect-override "16:9" "4:3" "2.35:1" "no"
	对比度 -  [1]	add contrast -1
	对比度 +  [2]	add contrast 1
	亮度 -  [3]	add brightness -1
	亮度 +  [4]	add brightness 1
	伽马 -  [5]	add gamma -1
	伽马 +  [6]	add gamma 1
	饱和度 -  [7]	add saturation -1
	饱和度 +  [8]	add saturation 1
	反交错  [d]	cycle deinterlace
音频
	音轨  [g-a]	$audio-tracks
	音轨循环  [#]	cycle audio
	音频延迟 -0.1s  [Ctrl+-]	add audio-delay -0.1
	音频延迟 +0.1s  [Ctrl++]	add audio-delay 0.1
	音频设备  [g-d]	$audio-devices
字幕
	加载本地字幕…	script-binding load_local_subtitle/open
	字幕轨  [g-s]	$sub-tracks
	次字幕轨  [g-S]	$secondary-sub-tracks
	显示 / 隐藏  [v]	cycle sub-visibility
	字幕延迟 -0.1s  [z]	add sub-delay -0.1
	字幕延迟 +0.1s  [Z]	add sub-delay 0.1
	位置上移  [r]	add sub-pos -1
	位置下移  [R]	add sub-pos 1
	字幕放大  [G]	add sub-scale 0.1
	字幕缩小  [F]	add sub-scale -0.1
	字幕样式	cycle-values sub-ass-override "force" "scale"
速度
	0.5x	multiply speed 0.5
	1.0x	set speed 1
	1.5x	multiply speed 1.5
	2.0x	multiply speed 2.0
	加快  []]	multiply speed 1.1
	减慢  [[]	multiply speed 1/1.1
	恢复正常  [Backspace]	set speed 1

查看
	全屏  [f]	cycle fullscreen
	窗口置顶  [T]	cycle ontop
	窗口 50%  [Alt+0]	set window-scale 0.5
	窗口 100%  [Alt+1]	set window-scale 1.0
	窗口 150%	set window-scale 1.5
	窗口 200%  [Alt+2]	set window-scale 2.0
	显示进度  [o]	show-progress
	播放信息  [i]	script-binding stats/display-stats
	观看历史  [g-h]	script-binding select/select-watch-history
画质预设
	基础画质  [Ctrl+0]	script-message-to quality_presets select base
	动画增强（RAVU）  [Ctrl+8]	script-message-to quality_presets select anime
	真人增强（RAVU）  [Ctrl+9]	script-message-to quality_presets select liveaction
	Anime4K
		模式 A  [Ctrl+1]	script-message-to quality_presets select anime4k-1
		模式 B  [Ctrl+2]	script-message-to quality_presets select anime4k-2
		模式 C  [Ctrl+3]	script-message-to quality_presets select anime4k-3
		模式 A+A  [Ctrl+4]	script-message-to quality_presets select anime4k-4
		模式 B+B  [Ctrl+5]	script-message-to quality_presets select anime4k-5
		模式 C+A  [Ctrl+6]	script-message-to quality_presets select anime4k-6
	ArtCNN
		C4F16（轻量）	script-message-to quality_presets select artcnn16
		C4F32  [Ctrl+7]	script-message-to quality_presets select artcnn32
	去色带：开启  [b]	script-message-to quality_presets toggle-deband


配置
	编辑 mpv.conf	  run notepad "C:/Users/Gosickless/AppData/Roaming/mpv/mpv.conf"
	编辑 input.conf  [Ctrl+I]	run notepad "C:/Users/Gosickless/AppData/Roaming/mpv/input.conf"
	编辑 menu.conf	run notepad "C:/Users/Gosickless/AppData/Roaming/mpv/menu.conf"
	编辑 modernz.conf  	run notepad "C:/Users/Gosickless/AppData/Roaming/mpv/script-opts/modernz.conf"
	编辑 context_menu.conf 	run notepad "C:/Users/Gosickless/AppData/Roaming/mpv/script-opts/context_menu.conf"
	打开配置文件夹	run cmd /c start "" "C:/Users/Gosickless/AppData/Roaming/mpv"
工具
	截图（带字幕）  [s]	osd-msg screenshot
	截图（无字幕）  [S]	osd-msg screenshot video
	截取窗口画面  [Ctrl+S]	osd-msg screenshot window
	A-B 循环  [l]	ab-loop
	单集循环  [L]	cycle-values loop-file "inf" "no"
	控制台  [`]	script-binding console/enable
帮助
	按键说明  [g-b]	script-binding select/select-binding
	统计信息  [I]	script-binding stats/display-stats-toggle
	mpv 版本	show-text ${mpv-version}
	在线文档	script-binding select/open-docs
