# ============================================================
# mpv 核心配置
# ------------------------------------------------------------
# 用法说明：
#   · 每个设置上面都有一行中文说明，改数字/路径即可
#   · 改完保存，下次打开 mpv 生效
#   · 想关闭某项：行首加 # 注释掉
# ============================================================

# ---------- 渲染 / 画质 ----------
vo=gpu-next                      # 渲染器：gpu-next（mpv 0.41 推荐，色彩管理最好）
profile=high-quality             # 高质量预设：自动启用 EWA LanczosSharp 缩放 + HDR 参数
hwdec=auto-copy                       # 硬件解码：自动（你的 RTX 3060 会走 nvdec/d3d11），加上copy会写回内存
target-colorspace-hint=auto      # 自动向系统输出正确的色彩空间 / HDR 元数据
deband=yes                       # 去色带：动漫天空/夜景渐变必开（快捷键 b 可临时开关）

# ---------- 播放 ----------
save-position-on-quit=yes        # 退出时记住播放位置，下次接着看
save-watch-history=yes           # 记录观看历史（供 g-h / 菜单「观看历史」使用）
sub-auto=fuzzy                   # 自动加载同名外挂字幕（模糊匹配）
slang=zh-Hans,zh-Hant,zho,chi,chs,cht,zh,eng,en   # 字幕优先顺序：简体中文→繁体→英文
alang=ja,jpn                                        # 音轨优先顺序：日语（动漫原声）→ 无日语时退回默认

# ---------- 字幕（动漫 ASS 特效）----------
sub-ass-override=no              # 保留字幕组原始排版（改成 force 会毁掉特效！）
embeddedfonts=yes                # 使用 MKV/ASS 内嵌字体

# ---------- 截图 ----------
screenshot-format=png            # 截图格式：PNG
screenshot-directory=D:/Picture/mpv截图    # 截图保存目录（~~/ = 本配置目录）

# ---------- 界面（ModernZ 皮肤）----------
osc=no                           # 关闭 mpv 自带控制条（交给 ModernZ）
border=no                        # 无系统窗口边框（ModernZ 提供自定义标题栏）
osd-bar=no                       # 关闭自带进度条（ModernZ 有自己的）
window-corners=round             # 窗口四角圆角化（round=圆角 / roundsmall=小圆角 / donotround=直角）
title-bar=no                     # 关掉系统原生标题栏（让 ModernZ 自定义标题栏接管）
load-context-menu=yes            # 启用右键上下文菜单（鼠标位置弹出）
watch-later-options-remove=sub-pos
watch-later-options-remove=volume
watch-later-options-remove=mute

