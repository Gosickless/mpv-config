# ============================================================
# mpv 选择菜单外观 (console.conf)
# 控制 g-p/g-a/g-s（播放列表/音轨/字幕）打开的菜单样式
# 改完保存后重开 mpv 生效
# ============================================================

# 选中项文字颜色（深紫黑，衬在粉色高亮上）
focused_color=#241926

# 选中项高亮背景（樱花粉，与 ModernZ 一致）
focused_back_color=#f6a6c1

# 搜索匹配文字高亮（淡紫）
match_color=#b9a7ff

# 菜单四角圆角半径
corner_radius=8

# 菜单字体大小
font_size=19

# 菜单背景透明度（ASS alpha：0=不透明，255=全透明；越高越透明）
background_alpha=165
