# ============================================================
# ModernZ 皮肤配置（脚本：scripts/modernz.lua）
# ------------------------------------------------------------
# 用法说明：
#   · 注释必须写在选项的上面一行（单独一行），不能跟在值后面
#   · 这里只列了常用项；没写的选项用 ModernZ 默认值
#   · 改完保存后，下次打开 mpv 即生效
#   · 全部选项清单见项目 docs/USER_OPTS.md
# ============================================================

# 界面语言：zh=中文（依赖 script-opts/modernz-locale.json）
language=zh

# 布局：default 默认 / compact 紧凑 / mini 迷你 / seekbar 纯进度条
layout=default

# 图标主题：fluent / material
icon_theme=fluent

# 图标风格：mixed 混合 / filled 实心 / outline 线条
icon_style=mixed

# 顶部栏：yes=强制显示 ModernZ 自定义标题栏（配合 mpv.conf 的 title-bar=no）
window_top_bar=yes

# 显示窗口控制按钮（最小化 / 最大化 / 关闭）
window_controls=yes

# 仅鼠标移动时才显示控制栏（键盘操作如空格/方向键不触发显示）
showonpause=no
osc_on_seek=no
osc_on_start=no

# 窗口控制按钮（右上角三个图标）的字号
window_controls_size=16

# ---------- 樱花紫配色 ----------

# 主强调色（控制栏 + 标题栏底色）：樱花粉
osc_color=#f6a6c1

# 进度条 已播放部分：樱花粉
seekbarfg_color=#f6a6c1

# 进度条 未播放部分：深紫灰
seekbarbg_color=#4a4056

# 进度条 拖动手柄：樱花粉
seek_handle_color=#f6a6c1

# 手柄内描边：浅粉
seek_handle_border_color=#ffd9e6

# 缓冲范围：灰紫
seekbar_cache_color=#6a5f7a

# 章节标记点：淡紫
nibble_color=#b9a7ff

# 当前章节标记点：樱花粉
nibble_current_color=#f6a6c1

# A-B 循环区间：淡紫
ab_loop_color=#b9a7ff

# 视频标题文字：淡粉白
title_color=#fcebf3

# 时间码：淡粉白
time_color=#fcebf3

# 无边框模式下的窗口标题：淡粉白
window_title_color=#fcebf3

# 窗口控制按钮（最小化/最大化/关闭）：淡粉白
window_controls_color=#fcebf3

# 侧边按钮（音轨/字幕/播放列表等）：淡粉白
side_buttons_color=#fcebf3

# 中间按钮（跳转/循环等）：淡粉白
middle_buttons_color=#fcebf3

# 播放/暂停键：樱花粉
playpause_color=#f6a6c1

# 鼠标悬停高亮：淡紫
hover_effect_color=#b9a7ff

# 按下时的颜色：淡紫
held_element_color=#b9a7ff

# 缩略图背景（配合 scripts/thumbfast.lua）：深紫黑
thumbnail_box_color=#1d1724

# 缩略图边框：灰紫
thumbnail_box_outline=#6a5f7a

# ---------- 底部控制栏图标大小 ----------
# 播放/暂停按钮图标字号
playpause_size=25

# 中间按钮（跳转/循环等）图标字号
midbuttons_size=21

# 侧边按钮（音轨/字幕/播放列表等）图标字号
sidebuttons_size=21

# 下一集/上一集按钮：先保存当前进度再切换（避免切走后进度丢失）
playlist_next_mbtn_left_command=write-watch-later-config; playlist-next
playlist_prev_mbtn_left_command=write-watch-later-config; playlist-prev

# 倍速按钮左键：循环常用倍速（含 0.5 / 0.75；右键仍为恢复 1x）
speed_mbtn_left_command=cycle-values speed 0.5 0.75 1.0 1.25 1.5 2.0 3.0

# 跳转按钮步长（秒）：左键 / 右键
jump_amount=10
jump_more_amount=60

# 跳转按钮寻址方式：relative=吸关键帧（默认值），exact=精确
jump_mode=exact

# 进度条滚轮跳转（没有专门的开关，直接在命令后面缀 exact）
seekbar_wheel_up_command=seek 10 exact
seekbar_wheel_down_command=seek -10 exact
