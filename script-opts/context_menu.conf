# ============================================================
# mpv 右键上下文菜单外观 (context_menu.conf)
# ------------------------------------------------------------
# 注释必须写在单独一行；改完保存后重开 mpv 生效
# ============================================================

# 菜单字体大小（数字越大字越大）
font_size=19

# 菜单项之间的间距
gap=0.3

# 菜单项左右内边距（像素，越大菜单越宽）
padding_x=16

# 菜单项上下内边距（像素）
padding_y=6

# 菜单外描边粗细（0=无描边）
menu_outline_size=1

# 菜单外描边颜色
menu_outline_color=#f6a6c1

# 菜单背景透明度（ASS alpha：0=不透明，255=全透明；如 128 半透明）
background_alpha=115

# 菜单四角圆角半径（像素）
corner_radius=8

# 高亮项文字颜色
focused_color=#241926

# 高亮项背景颜色（樱花粉）
focused_back_color=#f6a6c1

# 禁用项文字颜色（要能看清但不能太亮；嫌灰就调更深，看不清就调更浅）
disabled_color=#bfb6cc

# 悬停在有子菜单的项上，等多久才展开子菜单（秒；脚本默认 0.2，0=立即展开）
seconds_to_open_submenus=0

# 鼠标移开后，等多久才收起子菜单（秒；脚本默认 0.2，0=立即收起）
seconds_to_close_submenus=0

