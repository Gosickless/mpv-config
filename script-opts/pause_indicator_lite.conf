# 暂停指示图标类型："pause"=暂停图标 / "play"=播放图标
indicator_icon=pause
# 暂停期间是否一直显示图标（no=短暂显示后消失）
indicator_stay=no
# 不常驻时，图标显示的时长（秒）
indicator_timeout=0.5
# 图标位置：top_left / top_right / top_center / middle_* / bottom_*（如 middle_center 居中）
indicator_pos=middle_center

# 是否允许用按键切换暂停
keybind_allow=no
# 切换暂停用的按键（默认 Ctrl+鼠标左键）
keybind_set=mbtn_left
# 按键模式："onpause"=仅暂停时激活（用于恢复）/ "always"=始终激活
keybind_mode=onpause
# 文件结束时禁用按键（防止片尾误触）
keybind_eof_disable=yes

# 图标填充颜色
icon_color=#FFFFFF
# 图标边框颜色（柔和淡白）
icon_border_color=#E6E6E6
# 图标边框粗细
icon_border_width=1.0
# 图标不透明度（0-100，越小越透明）
icon_opacity=78

# 暂停图标：两条竖线的宽度
rectangles_width=30
# 暂停图标：两条竖线的高度
rectangles_height=80
# 暂停图标：两条竖线之间的间距
rectangles_spacing=20

# 播放图标（三角）的宽度
triangle_width=80
# 播放图标（三角）的高度
triangle_height=80

# 恢复播放时是否闪现播放图标
flash_play_icon=yes
# 闪现图标的显示时长（秒）
flash_icon_timeout=0.5

# 是否用 ModernZ 图标字体（需 fonts/modernz-icons.ttf）
themed_icons=yes
# 图标主题：fluent / material
icon_theme=fluent
# 主题样式："outline" / "filled"
theme_style=filled
# 主题图标大小
themed_icon_size=90

# 静音相关
# 是否显示静音指示图标
mute_indicator=yes
# 静音图标位置：top_left / top_right / top_center / middle_* / bottom_*
mute_indicator_pos=top_right

# 静音图标大小
mute_icon_size=40
