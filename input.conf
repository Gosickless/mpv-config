# mpv 快捷键配置
# Anime4K 官方高端模板 (Ctrl+1~6) + ArtCNN (Ctrl+7) + 基础画质 (Ctrl+0)；新增 Ctrl+8/9 动画/真人增强
# 参考: https://github.com/bloc97/Anime4K/blob/master/md/Template/GLSL_Windows_High-end/input.conf

# --- Anime4K 模式 (官方高端 GPU 模板) ---

CTRL+1 script-message-to quality_presets select anime4k-1

CTRL+2 script-message-to quality_presets select anime4k-2

CTRL+3 script-message-to quality_presets select anime4k-3

CTRL+4 script-message-to quality_presets select anime4k-4

CTRL+5 script-message-to quality_presets select anime4k-5

CTRL+6 script-message-to quality_presets select anime4k-6

# --- ArtCNN (动漫超分) ---

CTRL+7 script-message-to quality_presets select artcnn32

# --- 恢复基础画质（同时恢复参数）---

CTRL+0 script-message-to quality_presets select base

# ============================================================
# 用户自定义按键（覆盖 mpv 默认）
# ============================================================

# 左右键：快退 / 快进 3 秒（原默认 5 秒）
LEFT seek -3 exact
RIGHT seek 3 exact

# 上下键：调低 / 调高 5% 音量（原默认是 ±60 秒跳转）
DOWN add volume -5
UP add volume 5

# Shift+上下键：精准调低 / 调高 1% 音量（原默认是精确跳转 ±5 秒）
Shift+DOWN add volume -1
Shift+UP add volume 1

# assrt 字幕搜索：从默认的 a 改为 Ctrl+a；a 键禁用避免误触
Ctrl+a script-binding assrt/assrt
a ignore

# 鼠标右键：只打开上下文菜单（不自动选中项，避免误触发；菜单内用键盘方向键+Enter 或左键悬停操作）
MBTN_RIGHT script-message-to context_menu open

#鼠标左键：暂停视频
#MBTN_LEFT cycle pause

# 下一集 / 上一集：先保存当前进度再切换（否则切走后进度会丢失，回到片头）
> write-watch-later-config; playlist-next
< write-watch-later-config; playlist-prev

# 鼠标侧键（前进/后退）：同样先保存进度再切换
MBTN_FORWARD write-watch-later-config; playlist-next
MBTN_BACK write-watch-later-config; playlist-prev

# Enter：下一集，同样先保存进度再切换
ENTER write-watch-later-config; playlist-next

# 打开配置文件编辑器（用系统默认程序）
Ctrl+i script-binding select/edit-input-conf
Ctrl+, script-binding select/edit-config-file

CTRL+8 script-message-to quality_presets select anime

CTRL+9 script-message-to quality_presets select liveaction

b script-message-to quality_presets toggle-deband
